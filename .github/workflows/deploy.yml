name: 🚀 Deploy Landing Page a GitHub Pages

# Despliega la landing page (carpeta public/) en GitHub Pages
# cada vez que se integran cambios a la rama main.

on:
  push:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancelan despliegues en progreso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar a GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Empaquetar carpeta public/ como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: 🌙 Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
